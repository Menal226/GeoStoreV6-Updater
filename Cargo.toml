[package]
name = "geostore-updater"
version = "1.0.0"
edition = "2021"
description = "Automatické aktualizace GeoStore V6"
build = "build.rs"

[[bin]]
name = "GeoStoreUpdater"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.31"
encoding_rs = "0.8"
filetime = "0.2"
html-escape = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "cookies", "json", "native-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security_Credentials",
    "Win32_Storage_FileSystem",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
